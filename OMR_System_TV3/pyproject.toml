[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-tv3"
version = "1.0.0"
description = "Module Thành viên 3 (Phân đoạn ảnh & Nhận diện ô tô OMR) - Nhóm 4 PTIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "opencv-python>=4.8.0",
    "pytest>=7.4.0",
]

[tool.setuptools]
packages = ["tv3"]
package-dir = {"tv3" = "src"}
